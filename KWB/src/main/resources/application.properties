spring.application.name=KWB


# (Local)Database Connection - 환경변수로 덮어쓸 수 있음 (기본값은 로컬 개발용)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:KWB}?serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 시작 시 db/schema.sql 로 테이블 재생성 → CsvDataLoader 가 CSV 적재
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8

# MyBatis
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.type-aliases-package=com.application.KWB
mybatis.configuration.map-underscore-to-camel-case=true

# Port
server.port=80


spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
