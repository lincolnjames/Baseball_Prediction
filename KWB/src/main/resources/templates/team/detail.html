<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${teamName} + ' — 팀 정보'">팀 정보</title>
  <link rel="stylesheet" th:href="@{/css/kwb.css}" />
  <style>
    .team-hero {
      display: flex; align-items: center; gap: 16px; margin: 4px 0 22px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 20px; box-shadow: var(--shadow-card);
    }
    .team-hero .name { font-size: 22px; font-weight: 800; }
    .team-hero .sub { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
  </style>
</head>
<body>

<header th:replace="~{fragments/header :: nav(active='schedule')}"></header>

<div class="page">
  <div class="team-hero" th:data-team="${teamName}">
    <span class="badge badge-xl" th:data-team="${teamName}" th:text="${teamName}"></span>
    <div>
      <div class="name" th:text="${teamName}">팀</div>
      <div class="sub">타자 <span th:text="${hitterList.size()}">0</span>명 · 투수 <span th:text="${pitcherList.size()}">0</span>명</div>
    </div>
  </div>

  <div class="card">
    <h3 class="card-title">타자</h3>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>이름</th>
            <th class="num">타율</th>
            <th class="num">출루율</th>
            <th class="num">장타율</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="HitterDTO, stat : ${hitterList}">
            <td class="muted" th:text="${stat.index + 1}">1</td>
            <td th:text="${HitterDTO.player}">홍길동</td>
            <td class="num" th:text="${HitterDTO.AVG}">0.259</td>
            <td class="num" th:text="${HitterDTO.OBP}">0.333</td>
            <td class="num" th:text="${HitterDTO.SLG}">0.393</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3 class="card-title">투수</h3>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>이름</th>
            <th class="num">경기수</th>
            <th class="num">승리</th>
            <th class="num">패배</th>
            <th class="num">이닝수</th>
            <th class="num">평균자책</th>
            <th class="num">WHIP</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="PitcherDTO, stat : ${pitcherList}">
            <td class="muted" th:text="${stat.index + 1}">1</td>
            <td th:text="${PitcherDTO.player}">홍길동</td>
            <td class="num" th:text="${PitcherDTO.G}">32</td>
            <td class="num" th:text="${PitcherDTO.W}">128</td>
            <td class="num" th:text="${PitcherDTO.L}">5</td>
            <td class="num" th:text="${PitcherDTO.IP}">3</td>
            <td class="num" th:text="${PitcherDTO.ERA}">3</td>
            <td class="num" th:text="${PitcherDTO.WHIP}">0.5</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
