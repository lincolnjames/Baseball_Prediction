<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KWB 승부예측 — 경기 일정</title>
  <link rel="stylesheet" th:href="@{/css/kwb.css}" />
</head>
<body>

<header th:replace="~{fragments/header :: nav(active='schedule')}"></header>

<div class="page">

  <div class="section-head">
    <h1>경기 일정</h1>
    <p>월과 팀을 골라 경기를 찾고, <b>라인업</b>으로 선수를 확인하거나 <b>승부예측</b>으로 시나리오를 분석하세요.</p>
  </div>

  <div class="pill-tabs" id="monthTabs">
    <div class="pill-tab" th:each="m : ${#numbers.sequence(1,12)}" th:data-month="${m}" th:text="${m} + '월'"></div>
    <div class="pill-tab" data-month="13">포스트시즌</div>
  </div>

  <div class="team-chip-row">
    <a class="team-chip all" href="/"><span class="badge badge-md">전체</span>팀 전체</a>
    <a class="team-chip" th:href="@{/team/detail(team='KIA')}" data-team="KIA">
      <span class="badge badge-md" data-team="KIA">KIA</span>KIA</a>
    <a class="team-chip" th:href="@{/team/detail(team='삼성')}" data-team="삼성">
      <span class="badge badge-md" data-team="삼성">삼성</span>삼성</a>
    <a class="team-chip" th:href="@{/team/detail(team='LG')}" data-team="LG">
      <span class="badge badge-md" data-team="LG">LG</span>LG</a>
    <a class="team-chip" th:href="@{/team/detail(team='두산')}" data-team="두산">
      <span class="badge badge-md" data-team="두산">두산</span>두산</a>
    <a class="team-chip" th:href="@{/team/detail(team='KT')}" data-team="KT">
      <span class="badge badge-md" data-team="KT">KT</span>KT</a>
    <a class="team-chip" th:href="@{/team/detail(team='SSG')}" data-team="SSG">
      <span class="badge badge-md" data-team="SSG">SSG</span>SSG</a>
    <a class="team-chip" th:href="@{/team/detail(team='롯데')}" data-team="롯데">
      <span class="badge badge-md" data-team="롯데">롯데</span>롯데</a>
    <a class="team-chip" th:href="@{/team/detail(team='한화')}" data-team="한화">
      <span class="badge badge-md" data-team="한화">한화</span>한화</a>
    <a class="team-chip" th:href="@{/team/detail(team='NC')}" data-team="NC">
      <span class="badge badge-md" data-team="NC">NC</span>NC</a>
    <a class="team-chip" th:href="@{/team/detail(team='키움')}" data-team="키움">
      <span class="badge badge-md" data-team="키움">키움</span>키움</a>
  </div>

  <div id="scheduleList">
    <div class="empty-state">일정을 불러오는 중…</div>
  </div>

</div>

<script>
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : String(text);
  return div.innerHTML;
}

function teamBadge(name) {
  return `<span class="badge badge-sm" data-team="${escapeHtml(name)}">${escapeHtml(name)}</span>`;
}

function gameCard(game) {
  // KBO 표기 관례대로 원정 vs 홈
  const query = `hometeam=${encodeURIComponent(game.hometeam)}&awayteam=${encodeURIComponent(game.awayteam)}`;
  return `
    <div class="game-card">
      <div class="game-matchup">
        <div class="game-team" data-team="${escapeHtml(game.awayteam)}">
          ${teamBadge(game.awayteam)}<span class="name">${escapeHtml(game.awayteam)}</span><span class="tag">원정</span>
        </div>
        <div class="game-vs">@</div>
        <div class="game-team" data-team="${escapeHtml(game.hometeam)}">
          ${teamBadge(game.hometeam)}<span class="name">${escapeHtml(game.hometeam)}</span><span class="tag">홈</span>
        </div>
      </div>
      <div class="game-actions">
        <a class="btn btn-ghost btn-sm" href="/match/detail?${query}">라인업</a>
        <a class="btn btn-primary btn-sm" href="/match/predict?${query}">승부예측</a>
      </div>
    </div>`;
}

function renderSchedule(gameDates) {
  const list = document.getElementById('scheduleList');
  if (!gameDates || gameDates.length === 0) {
    list.innerHTML = '<div class="empty-state">이 달에는 예정된 경기가 없습니다.</div>';
    return;
  }
  list.innerHTML = gameDates.map(gd => `
    <div class="schedule-date">${escapeHtml(gd.date)}</div>
    ${gd.games.map(gameCard).join('')}
  `).join('');
}

function loadMonth(month) {
  const list = document.getElementById('scheduleList');
  list.innerHTML = '<div class="empty-state">불러오는 중…</div>';
  fetch(`/match/month?month=${month}`)
    .then(res => { if (!res.ok) throw new Error(); return res.json(); })
    .then(renderSchedule)
    .catch(() => { list.innerHTML = '<div class="empty-state error-text">경기 정보를 불러오는 데 실패했습니다.</div>'; });
}

document.addEventListener('DOMContentLoaded', () => {
  const tabs = [...document.querySelectorAll('.pill-tab')];
  const today = new Date();
  const currentMonth = String(today.getMonth() + 1);
  const initial = tabs.find(t => t.dataset.month === currentMonth) || tabs[0];

  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    loadMonth(tab.dataset.month);
  }));

  initial.classList.add('active');
  loadMonth(initial.dataset.month);
});
</script>
</body>
</html>
