<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title th:text="${awayTeam} + ' @ ' + ${homeTeam} + ' — 라인업'">라인업</title>
<link rel="stylesheet" th:href="@{/css/kwb.css}" />
<style>
  body { padding-bottom: 96px; }
  .matchup-head {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    margin: 4px 0 6px; flex-wrap: wrap;
  }
  .matchup-head .side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .matchup-head .side .name { font-weight: 800; font-size: 16px; }
  .matchup-head .tag { font-size: 11.5px; color: var(--text-muted); font-weight: 700; }
  .matchup-head .at { color: var(--text-faint); font-weight: 800; font-size: 15px; }

  .team-panels { display: flex; gap: 18px; flex-wrap: wrap; }
  .team-panel { flex: 1 1 420px; min-width: 320px; }
  .team-panel h2 { font-size: 15px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .role-title {
    font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: .04em; margin: 16px 0 8px;
  }
  .role-title:first-of-type { margin-top: 6px; }
  .player-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 6px 0; border-bottom: 1px solid var(--border);
  }
  .player-row:last-child { border-bottom: none; }
  .btnPlayer {
    flex: 1; text-align: left; background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13.5px; font-weight: 700;
    color: var(--text); cursor: pointer; transition: all .15s;
  }
  .btnPlayer:hover { border-color: #c7d0e0; }
  .btnPlayer.active { background: #ecfdf5; border-color: var(--success); color: var(--success); }
  .player-row select { flex: none; width: 108px; }

  #runSimulationBar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px;
    background: linear-gradient(0deg, #fff 70%, rgba(255,255,255,0));
    display: flex; justify-content: center; z-index: 20;
  }
  #runSimulationBtn { min-width: 220px; }
  #simulationResult:empty { display: none; }
  .result-prob { font-size: 15px; margin: 4px 0; }
</style>
</head>
<body th:data-home-team="${homeTeam}" th:data-away-team="${awayTeam}">

<header th:replace="~{fragments/header :: nav(active='schedule')}"></header>

<div class="page">
  <div class="matchup-head">
    <div class="side">
      <span class="badge badge-lg" th:data-team="${awayTeam}" th:text="${awayTeam}">원정</span>
      <span class="name" th:text="${awayTeam}">원정팀</span>
      <span class="tag">원정</span>
    </div>
    <div class="at">@</div>
    <div class="side">
      <span class="badge badge-lg" th:data-team="${homeTeam}" th:text="${homeTeam}">홈</span>
      <span class="name" th:text="${homeTeam}">홈팀</span>
      <span class="tag">홈</span>
    </div>
  </div>
  <p class="center">
    <a th:href="@{/match/predict(hometeam=${homeTeam},awayteam=${awayTeam})}">라인업 시나리오 분석 · 확정 예측 화면으로 →</a>
  </p>

  <div class="team-panels">
    <!-- 홈팀 -->
    <div class="card team-panel" id="homeTeam">
      <h2><span class="badge badge-sm" th:data-team="${homeTeam}" th:text="${homeTeam}"></span>
        <span th:text="${homeTeam} + ' (홈)'">홈팀 선수 목록</span></h2>

      <div class="role-title">타자</div>
      <div id="homeHittersContainer">
        <div class="player-row" th:each="hitter : ${homeHitters}">
          <button type="button" class="btnPlayer" th:text="${hitter.player}"></button>
          <select class="battingOrderSelect">
            <option value="">타순 선택</option>
            <option th:each="i : ${#numbers.sequence(1,9)}"
                    th:value="${i}" th:text="${i} + '번 타자'"></option>
          </select>
        </div>
      </div>

      <div class="role-title">투수</div>
      <div id="homePitchersContainer">
        <div class="player-row" th:each="pitcher : ${homePitchers}">
          <button type="button" class="btnPlayer" th:text="${pitcher.player}"></button>
          <select class="pitchingOrderSelect">
            <option value="">역할 선택</option>
            <option value="1">선발투수</option>
            <option value="2">중간계투1</option>
            <option value="3">중간계투2</option>
            <option value="4">중간계투3</option>
            <option value="5">마무리투수</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 어웨이팀 -->
    <div class="card team-panel" id="awayTeam">
      <h2><span class="badge badge-sm" th:data-team="${awayTeam}" th:text="${awayTeam}"></span>
        <span th:text="${awayTeam} + ' (원정)'">어웨이팀 선수 목록</span></h2>

      <div class="role-title">타자</div>
      <div id="awayHittersContainer">
        <div class="player-row" th:each="hitter : ${awayHitters}">
          <button type="button" class="btnPlayer" th:text="${hitter.player}"></button>
          <select class="battingOrderSelect">
            <option value="">타순 선택</option>
            <option th:each="i : ${#numbers.sequence(1,9)}"
                    th:value="${i}" th:text="${i} + '번 타자'"></option>
          </select>
        </div>
      </div>

      <div class="role-title">투수</div>
      <div id="awayPitchersContainer">
        <div class="player-row" th:each="pitcher : ${awayPitchers}">
          <button type="button" class="btnPlayer" th:text="${pitcher.player}"></button>
          <select class="pitchingOrderSelect">
            <option value="">역할 선택</option>
            <option value="1">선발투수</option>
            <option value="2">중간계투1</option>
            <option value="3">중간계투2</option>
            <option value="4">중간계투3</option>
            <option value="5">마무리투수</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div id="simulationResult" class="card"></div>
</div>

<div id="runSimulationBar">
  <button id="runSimulationBtn" class="btn btn-primary btn-lg" type="button">시뮬레이션 실행</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const runSimBtn = document.getElementById('runSimulationBtn');

  // 플레이어 버튼 스타일 토글
  document.querySelectorAll('.btnPlayer').forEach(button => {
    button.addEventListener('click', () => {
      button.classList.toggle('active');
    });
  });

  // 타순 추출 함수 (1~9 중복 없이 필수)
  function getOrderedBatters(containerId) {
    const playerRows = document.querySelectorAll(`#${containerId} .player-row`);
    const orderMap = [];

    playerRows.forEach(row => {
      const name = row.querySelector('.btnPlayer').textContent.trim();
      const order = row.querySelector('.battingOrderSelect').value;
      if (order) {
        orderMap.push({ order: parseInt(order), name });
      }
    });

    const orders = orderMap.map(o => o.order);
    const uniqueOrders = new Set(orders);
    if (orders.length !== 9 || uniqueOrders.size !== 9) return null;

    orderMap.sort((a, b) => a.order - b.order);
    return orderMap.map(o => o.name);
  }

  // 투수 역할 추출 (1=선발 필수, 2~4=중간계투 등판 순서, 5=마무리). 역할 중복 불가
  function getPitchingStaff(containerId) {
    const playerRows = document.querySelectorAll(`#${containerId} .player-row`);
    const byOrder = new Map();

    for (const row of playerRows) {
      const name = row.querySelector('.btnPlayer').textContent.trim();
      const order = row.querySelector('.pitchingOrderSelect').value;
      if (!order) continue;
      if (byOrder.has(order)) return null;
      byOrder.set(order, name);
    }
    if (!byOrder.has('1')) return null;

    return {
      starter: byOrder.get('1'),
      middle: ['2', '3', '4'].filter(o => byOrder.has(o)).map(o => byOrder.get(o)),
      closer: byOrder.get('5') || null
    };
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  runSimBtn.addEventListener('click', async () => {
    const homeHitters = getOrderedBatters("homeHittersContainer");
    const awayHitters = getOrderedBatters("awayHittersContainer");
    const homeStaff = getPitchingStaff("homePitchersContainer");
    const awayStaff = getPitchingStaff("awayPitchersContainer");

    if (!homeHitters || !awayHitters) {
      alert('타자 타순(1~9번)을 중복 없이 모두 지정해야 합니다.');
      return;
    }
    if (!homeStaff || !awayStaff) {
      alert('각 팀 선발투수를 지정해야 하며, 투수 역할은 중복될 수 없습니다.');
      return;
    }

    const homeTeam = document.body.dataset.homeTeam;
    const awayTeam = document.body.dataset.awayTeam;
    const requestBody = {
      homeTeam,
      awayTeam,
      home: { lineup: homeHitters, ...homeStaff },
      away: { lineup: awayHitters, ...awayStaff },
      matchCount: 1000
    };

    runSimBtn.disabled = true;
    document.getElementById('simulationResult').innerHTML = "<b>시뮬레이션 실행 중…</b>";

    try {
      const response = await fetch('/simulation/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.message || '서버 오류');
      }
      const result = await response.json();

      const home = escapeHtml(homeTeam);
      const away = escapeHtml(awayTeam);
      const warnings = (result.warnings || []).map(w => `<li>${escapeHtml(w)}</li>`).join('');
      const homePct = (result.home_win_rate * 100).toFixed(1);
      const awayPct = (result.away_win_rate * 100).toFixed(1);
      document.getElementById('simulationResult').innerHTML = `
        <h3 class="card-title">시뮬레이션 결과 (${result.match_count.toLocaleString()}경기)</h3>
        <div class="prob-bar">
          <div class="seg away" data-team="${away}" style="width:${awayPct}%">${away} ${awayPct}%</div>
          <div class="seg home" data-team="${home}" style="width:${homePct}%">${home} ${homePct}%</div>
        </div>
        <div class="result-prob muted">무승부: ${(result.draw_rate * 100).toFixed(1)}% (${result.draw_count}경기)</div>
        <div class="result-prob">평균 득점 <b>${away} ${result.away_avg_score.toFixed(2)} : ${result.home_avg_score.toFixed(2)} ${home}</b></div>
        ${warnings ? `<div class="card alert-warn" style="margin-top:12px">주의<ul>${warnings}</ul></div>` : ''}
      `;
    } catch (err) {
      document.getElementById('simulationResult').innerHTML = "<b class=\"error-text\">오류가 발생했습니다: " + escapeHtml(err.message) + "</b>";
    } finally {
      runSimBtn.disabled = false;
    }
  });
});
</script>

</body>
</html>
