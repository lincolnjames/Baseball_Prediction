<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Match Detail - 선수 선택</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f7f9fc;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 40px;
  }
  .team-container {
    display: flex;
    justify-content: space-around;
    gap: 20px;
    flex-wrap: wrap;
  }
  .player-list {
    background-color: #ffffff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    width: 45%;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .player-list h2 {
    color: #34495e;
    margin-bottom: 10px;
    border-bottom: 2px solid #3498db;
    padding-bottom: 5px;
  }
  .player-list h3 {
    color: #2c3e50;
    margin-top: 20px;
    margin-bottom: 10px;
  }
  .btnPlayer {
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    margin: 6px;
    cursor: pointer;
    font-size: 16px;
    min-width: 120px;
    transition: background-color 0.3s ease;
    display: inline-block;
    text-align: center;
  }
  .btnPlayer.active {
    background-color: #2ecc71;
    color: white;
    font-weight: bold;
    box-shadow: 0 0 8px #27ae60;
  }
  .btnPlayer:hover {
    background-color: #2980b9;
  }
  #runSimulationBtn {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #e74c3c;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 16px 48px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(231, 76, 60, 0.6);
    transition: background-color 0.3s ease;
    z-index: 1000;
  }
  #runSimulationBtn:hover {
    background-color: #c0392b;
  }
  #simulationResult {
    margin: 40px auto 0 auto;
    padding: 24px;
    background: #f8f8ff;
    border-radius: 10px;
    width: 60%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    font-size: 16px;
    color: #222;
  }
</style>
</head>
<body th:data-home-team="${homeTeam}" th:data-away-team="${awayTeam}">

<h1 th:text="${awayTeam} + ' (원정) vs ' + ${homeTeam} + ' (홈)'">경기 선수 선택</h1>
<p style="text-align:center">
  <a th:href="@{/match/predict(hometeam=${homeTeam},awayteam=${awayTeam})}">라인업 시나리오 분석 · 확정 예측 화면으로 →</a>
</p>

<div class="team-container">
  <!-- 홈팀 -->
  <div class="player-list" id="homeTeam">
    <h2 th:text="${homeTeam} + ' (홈)'">홈팀 선수 목록</h2>

    <h3>타자</h3>
    <div id="homeHittersContainer">
      <div class="player-row" th:each="hitter : ${homeHitters}">
        <button type="button" class="btnPlayer" th:text="${hitter.player}"></button>
        <select class="battingOrderSelect">
          <option value="">--선택--</option>
          <option th:each="i : ${#numbers.sequence(1,9)}"
                  th:value="${i}" th:text="${i} + '번 타자'"></option>
        </select>
      </div>
    </div>

    <h3>투수</h3>
    <div id="homePitchersContainer">
      <div class="player-row" th:each="pitcher : ${homePitchers}">
        <button type="button" class="btnPlayer" th:text="${pitcher.player}"></button>
        <select class="pitchingOrderSelect">
			<option value="">--선택--</option>
		    <option value="1">선발투수</option>
		    <option value="2">중간계투1</option>
		    <option value="3">중간계투2</option>
		    <option value="4">중간계투3</option>
		    <option value="5">마무리투수</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 어웨이팀 -->
  <div class="player-list" id="awayTeam">
    <h2 th:text="${awayTeam} + ' (원정)'">어웨이팀 선수 목록</h2>

    <h3>타자</h3>
    <div id="awayHittersContainer">
      <div class="player-row" th:each="hitter : ${awayHitters}">
        <button type="button" class="btnPlayer" th:text="${hitter.player}"></button>
        <select class="battingOrderSelect">
          <option value="">--선택--</option>
          <option th:each="i : ${#numbers.sequence(1,9)}"
                  th:value="${i}" th:text="${i} + '번 타자'"></option>
        </select>
      </div>
    </div>

    <h3>투수</h3>
	<div id="awayPitchersContainer">
	  <div class="player-row" th:each="pitcher : ${awayPitchers}">
	    <button type="button" class="btnPlayer" th:text="${pitcher.player}"></button>
	    <select class="pitchingOrderSelect">
	      <option value="">--선택--</option>
	      <option value="1">선발투수</option>
	      <option value="2">중간계투1</option>
	      <option value="3">중간계투2</option>
	      <option value="4">중간계투3</option>
	      <option value="5">마무리투수</option>
	    </select>
	  </div>
	</div>
  </div>
</div>

<button id="runSimulationBtn" type="button">시뮬레이션 실행</button>

<div id="simulationResult"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const runSimBtn = document.getElementById('runSimulationBtn');

  // 플레이어 버튼 스타일 토글
  document.querySelectorAll('.btnPlayer').forEach(button => {
    button.addEventListener('click', () => {
      button.classList.toggle('active');
    });
  });

  // 타순 추출 함수 (1~9 중복 없이 필수)
  function getOrderedBatters(containerId) {
    const playerRows = document.querySelectorAll(`#${containerId} .player-row`);
    const orderMap = [];

    playerRows.forEach(row => {
      const name = row.querySelector('.btnPlayer').textContent.trim();
      const order = row.querySelector('.battingOrderSelect').value;
      if (order) {
        orderMap.push({ order: parseInt(order), name });
      }
    });

    const orders = orderMap.map(o => o.order);
    const uniqueOrders = new Set(orders);
    if (orders.length !== 9 || uniqueOrders.size !== 9) return null;

    orderMap.sort((a, b) => a.order - b.order);
    return orderMap.map(o => o.name);
  }

  // 투수 역할 추출 (1=선발 필수, 2~4=중간계투 등판 순서, 5=마무리). 역할 중복 불가
  function getPitchingStaff(containerId) {
    const playerRows = document.querySelectorAll(`#${containerId} .player-row`);
    const byOrder = new Map();

    for (const row of playerRows) {
      const name = row.querySelector('.btnPlayer').textContent.trim();
      const order = row.querySelector('.pitchingOrderSelect').value;
      if (!order) continue;
      if (byOrder.has(order)) return null;
      byOrder.set(order, name);
    }
    if (!byOrder.has('1')) return null;

    return {
      starter: byOrder.get('1'),
      middle: ['2', '3', '4'].filter(o => byOrder.has(o)).map(o => byOrder.get(o)),
      closer: byOrder.get('5') || null
    };
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  runSimBtn.addEventListener('click', async () => {
    const homeHitters = getOrderedBatters("homeHittersContainer");
    const awayHitters = getOrderedBatters("awayHittersContainer");
    const homeStaff = getPitchingStaff("homePitchersContainer");
    const awayStaff = getPitchingStaff("awayPitchersContainer");

    if (!homeHitters || !awayHitters) {
      alert('타자 타순(1~9번)을 중복 없이 모두 지정해야 합니다.');
      return;
    }
    if (!homeStaff || !awayStaff) {
      alert('각 팀 선발투수를 지정해야 하며, 투수 역할은 중복될 수 없습니다.');
      return;
    }

    const homeTeam = document.body.dataset.homeTeam;
    const awayTeam = document.body.dataset.awayTeam;
    const requestBody = {
      homeTeam,
      awayTeam,
      home: { lineup: homeHitters, ...homeStaff },
      away: { lineup: awayHitters, ...awayStaff },
      matchCount: 1000
    };

    document.getElementById('simulationResult').innerHTML = "<b>시뮬레이션 실행 중...</b>";

    try {
      const response = await fetch('/simulation/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.message || '서버 오류');
      }
      const result = await response.json();

      const home = escapeHtml(homeTeam);
      const away = escapeHtml(awayTeam);
      const warnings = (result.warnings || []).map(w => `<li>${escapeHtml(w)}</li>`).join('');
      document.getElementById('simulationResult').innerHTML = `
        <h3>시뮬레이션 결과 (${result.match_count}경기)</h3>
        <div>${home} 승률: ${(result.home_win_rate * 100).toFixed(1)}% (${result.home_win_count}승)</div>
        <div>${away} 승률: ${(result.away_win_rate * 100).toFixed(1)}% (${result.away_win_count}승)</div>
        <div>무승부: ${(result.draw_rate * 100).toFixed(1)}% (${result.draw_count}경기)</div>
        <div>평균 득점: ${home} ${result.home_avg_score.toFixed(2)} : ${result.away_avg_score.toFixed(2)} ${away}</div>
        ${warnings ? `<div style="margin-top:12px;color:#b45309">주의<ul>${warnings}</ul></div>` : ''}
      `;
    } catch (err) {
      document.getElementById('simulationResult').innerHTML = "<b>오류가 발생했습니다: " + escapeHtml(err.message) + "</b>";
    }
  });
});
</script>

</body>
</html>
