<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title th:text="${awayTeam} + ' @ ' + ${homeTeam} + ' — 승부예측'">승부 예측</title>
<link rel="stylesheet" th:href="@{/css/kwb.css}" />
<style>
  .lead { text-align: center; margin: 0 0 20px; font-size: 13.5px; }
  .lead b { color: var(--text); }
  .game-date-line { text-align: center; margin: 0 0 22px; }
  .teams { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .team { width: min(520px, 100%); box-sizing: border-box; }
  .team h2 { margin: 0 0 12px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .team select { font-size: 13.5px; max-width: 100%; }
  .starter select { width: 100%; margin: 4px 0 14px; }
  table.lineup { width: 100%; border-collapse: collapse; }
  table.lineup td { padding: 4px 2px; }
  table.lineup td:first-child { width: 24px; text-align: center; color: var(--text-faint); font-weight: 700; font-size: 12px; }
  table.lineup select.pos { width: 88px; }
  table.lineup select.player { width: 100%; }
  .team-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .quick-fill { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .quick-fill summary { cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--primary); }
  .quick-fill textarea.paste-box {
    width: 100%; box-sizing: border-box; font-family: inherit; font-size: 12.5px;
    resize: vertical; margin-top: 4px;
  }
  .paste-status { font-size: 12px; }
  .actions { display: flex; justify-content: center; gap: 12px; margin: 22px 0; flex-wrap: wrap; }
  #result { max-width: 1060px; margin: 0 auto; }
  table.effects th, table.effects td { font-size: 13.5px; }
</style>
</head>
<body th:data-home-team="${homeTeam}" th:data-away-team="${awayTeam}">

<header th:replace="~{fragments/header :: nav(active='schedule')}"></header>

<div class="page">
<div class="matchup-title" style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px;flex-wrap:wrap;">
  <span class="badge badge-md" th:data-team="${awayTeam}" th:text="${awayTeam}"></span>
  <h1 style="font-size:20px;" th:text="${awayTeam} + ' (원정) vs ' + ${homeTeam} + ' (홈)'">승부 예측</h1>
  <span class="badge badge-md" th:data-team="${homeTeam}" th:text="${homeTeam}"></span>
</div>
<p class="lead">예고 선발과 예상 라인업으로 <b>시나리오 분석</b>을 하고, 라인업이 발표되면 실제 라인업으로 <b>확정 예측</b>을 하세요.
  결과 아래 버튼으로 예측을 기록하면 경기 후 <a href="/predictions">예측 성적</a>에서 채점됩니다.</p>
<p class="game-date-line">경기일 <input type="date" id="gameDate" th:value="${gameDate}" /></p>

<div class="teams">
  <section class="team card" id="team-away"></section>
  <section class="team card" id="team-home"></section>
</div>

<div class="actions">
  <button class="btn btn-primary btn-lg" id="analyzeBtn" type="button">시나리오 분석 (라인업 발표 전)</button>
  <button class="btn btn-secondary btn-lg" id="predictBtn" type="button">확정 예측 (발표된 라인업)</button>
</div>

<div id="result"></div>
</div>

<script th:inline="javascript">
  const DATA = /*[[${predictData}]]*/ {};
</script>
<script>
const FIELD_POSITIONS = ['포수', '1루수', '2루수', '3루수', '유격수', '좌익수', '중견수', '우익수'];
const POSITIONS = [...FIELD_POSITIONS, '지명타자'];
const SIDE_LABEL = { home: '홈', away: '원정' };

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : String(text);
  return div.innerHTML;
}
function rate(value) { return value == null ? '-' : Number(value).toFixed(3).replace(/^0/, ''); }
function pct(value) { return (value * 100).toFixed(1) + '%'; }
function pp(value) { return (value >= 0 ? '+' : '') + (value * 100).toFixed(1) + '%p'; }

// 팀별 포지션 선발 출장 수: 선수 → {포지션: GS}
const gsByPlayer = {};
for (const side of ['home', 'away']) {
  gsByPlayer[side] = {};
  for (const p of DATA[side].positions) {
    (gsByPlayer[side][p.player] ||= {})[p.pos] = Number(p.gs);
  }
}
const hasPositions = side => DATA[side].positions.length > 0;

function playerLabel(side, h) {
  const gs = Object.entries(gsByPlayer[side][h.player] || {}).sort((a, b) => b[1] - a[1]).slice(0, 2)
    .map(([pos, n]) => pos + ' ' + n).join(', ');
  return `${h.player}  (${rate(h.avg)} / ${rate(h.obp)} / ${rate(h.slg)}${gs ? ' · ' + gs : ''})`;
}

// 포지션을 많이 맡은 선수가 위로, 나머지는 타석 순
function sortedHitters(side, pos) {
  const hitters = DATA[side].hitters;
  if (pos === '지명타자' || !hasPositions(side)) return hitters;
  const gs = h => (gsByPlayer[side][h.player] || {})[pos] || 0;
  return [...hitters].sort((a, b) => gs(b) - gs(a) || b.pa - a.pa);
}

function fillPlayerOptions(side, row) {
  const pos = row.querySelector('.pos').value;
  const select = row.querySelector('.player');
  const current = select.value;
  select.innerHTML = '<option value="">선수 선택</option>' + sortedHitters(side, pos)
    .map(h => `<option value="${escapeHtml(h.player)}">${escapeHtml(playerLabel(side, h))}</option>`).join('');
  select.value = current;
}

function renderTeam(side) {
  const roster = DATA[side];
  const section = document.getElementById('team-' + side);
  const pitchers = roster.pitchers.map(p =>
    `<option value="${escapeHtml(p.player)}">${escapeHtml(`${p.player} (ERA ${p.era ?? '-'}, ${p.g}경기 ${p.ip}이닝)`)}</option>`).join('');
  const rows = POSITIONS.map((_, i) => `
    <tr data-order="${i + 1}">
      <td>${i + 1}</td>
      <td><select class="pos">${POSITIONS.map(p => `<option>${p}</option>`).join('')}</select></td>
      <td><select class="player"></select></td>
    </tr>`).join('');
  section.innerHTML = `
    <h2><span class="badge badge-sm" data-team="${escapeHtml(roster.team)}">${escapeHtml(roster.team)}</span>
      ${escapeHtml(roster.team)} <span class="muted">(${SIDE_LABEL[side]})</span></h2>
    <div class="starter"><label>선발투수</label>
      <select class="starter-select"><option value="">선발 선택</option>${pitchers}</select></div>
    <label>타순 · 포지션 · 선수 <span class="muted">(타율 / 출루율 / 장타율 · 포지션 선발 수)</span></label>
    <table class="lineup">${rows}</table>
    <div class="team-actions">
      <button class="btn btn-ghost btn-sm" type="button" data-action="auto">주전 자동 채우기</button>
      <button class="btn btn-ghost btn-sm" type="button" data-action="load">최근 입력 불러오기</button>
      <button class="btn btn-ghost btn-sm" type="button" data-action="optimize">최적 라인업 추천</button>
    </div>
    ${hasPositions(side) ? '' : '<p class="muted" style="color:var(--warning)">포지션 데이터가 없어 교체 후보를 타석 수로만 고릅니다.</p>'}
    <details class="quick-fill">
      <summary>표 붙여넣기로 채우기</summary>
      <p class="muted" style="margin:6px 0">다른 사이트의 타순표·경기 기록(박스스코어)·선발투수 정보를 복사해 붙여넣으면, 이름이 일치하는
        선수를 자동으로 채웁니다. 포지션은 "좌익수"든 "좌"·"一"(1루) 같은 약자든 상관없습니다.</p>
      <textarea class="paste-box" rows="4" placeholder="예) 1	2루수	신민재	1.02"></textarea>
      <div class="team-actions">
        <button class="btn btn-primary btn-sm" type="button" data-action="paste-fill">붙여넣기 반영</button>
        <span class="paste-status muted"></span>
      </div>
    </details>`;
  section.querySelectorAll('tr[data-order]').forEach((row, i) => {
    row.querySelector('.pos').value = POSITIONS[i];
    fillPlayerOptions(side, row);
    row.querySelector('.pos').addEventListener('change', () => fillPlayerOptions(side, row));
  });
  section.querySelector('[data-action=auto]').addEventListener('click', () => autoFill(side));
  section.querySelector('[data-action=paste-fill]').addEventListener('click', () => applyPasteFill(side));
  section.querySelector('[data-action=load]').addEventListener('click', () => {
    if (!loadSaved(side)) alert('이 브라우저에 저장된 라인업이 없습니다.');
  });
  section.querySelector('[data-action=optimize]').addEventListener('click', () => optimizeLineup(side));
}

function setLineup(side, slots, starter) {
  const section = document.getElementById('team-' + side);
  section.querySelectorAll('tr[data-order]').forEach((row, i) => {
    if (!slots[i]) return;
    row.querySelector('.pos').value = slots[i].pos;
    fillPlayerOptions(side, row);
    row.querySelector('.player').value = slots[i].name;
  });
  if (starter) section.querySelector('.starter-select').value = starter;
}

// 포지션별 선발 출장 1위(지명타자는 남은 선수 중 타석 1위)로 채우고 출루율 순으로 타순을 정한다
function autoFill(side) {
  const used = new Set();
  const picks = [];
  for (const pos of POSITIONS) {
    const candidate = sortedHitters(side, pos).find(h => !used.has(h.player));
    if (candidate) { used.add(candidate.player); picks.push({ name: candidate.player, pos, obp: Number(candidate.obp) || 0 }); }
  }
  picks.sort((a, b) => b.obp - a.obp);
  setLineup(side, picks);
}

// 다른 사이트에서 복사한 표(탭 구분)에서 우리 로스터 이름과 일치하는 값을 찾아 타순·선발투수를 채운다.
// 열 순서·여분의 열(WAR, ERA 등)은 상관없다 — 줄마다 "숫자 1~9", "포지션(풀네임 또는 한 글자 약자)",
// "로스터에 있는 타자명"이 모두 있으면 그 줄을 타순 한 줄로 보고, 그 외 줄에서 로스터 투수명과
// 일치하면 선발투수로 본다. 경기 기록(박스스코어) 표는 같은 타순 번호에 교체 선수도 같이 나오는데,
// 선발이 항상 먼저 나오므로 그 타순 번호에서 처음 찾은 한 줄만 쓴다.
const POSITION_ABBREVIATIONS = {
  '좌': '좌익수', '중': '중견수', '우': '우익수', '포': '포수', '지': '지명타자',
  '一': '1루수', '二': '2루수', '三': '3루수', '유': '유격수',
};
// 포지션에 이동 이력이 붙어 "二ー"(2루수로 시작해 나중에 다른 자리로), "三二"(3루수로 시작해
// 2루수로)처럼 두 글자로 나올 때가 있다 — 우리가 채우려는 건 "경기를 시작한 포지션"이므로 첫 글자를
// 쓴다. 대타·대주자로 들어온 선수는 "타三"(대타 후 3루)처럼 나오는데, 첫 글자("타")는 수비 포지션이
// 아니라서 안 걸린다 — 그 타순의 진짜 선발은 더 앞줄에서 이미 찾았을 것이다.
function resolvePosition(token) {
  const direct = POSITION_ABBREVIATIONS[token] || token;
  if (POSITIONS.includes(direct)) return direct;
  const first = POSITION_ABBREVIATIONS[token.charAt(0)];
  return first && POSITIONS.includes(first) ? first : null;
}
function parseQuickFill(side, text) {
  const roster = DATA[side];
  const hitterNames = new Set(roster.hitters.map(h => h.player));
  const pitcherNames = new Set(roster.pitchers.map(p => p.player));
  const seenOrders = new Set();
  const picks = [];
  let starter = null;
  for (const raw of text.split(/\r?\n/)) {
    const tokens = raw.trim().split(/\s+/).filter(Boolean);
    if (!tokens.length) continue;
    // 포지션은 항상 타순 번호 바로 다음 칸에 나온다 — 뒤쪽 타석 결과 칸("좌안" 등)과 헷갈리지 않도록
    // 그 칸만 본다.
    const orderIdx = tokens.findIndex(t => /^[1-9]$/.test(t));
    const orderTok = orderIdx >= 0 ? tokens[orderIdx] : null;
    const posTok = orderIdx >= 0 ? resolvePosition(tokens[orderIdx + 1] || '') : null;
    const nameTok = tokens.find(t => hitterNames.has(t));
    if (orderTok && posTok && nameTok && !seenOrders.has(orderTok)) {
      seenOrders.add(orderTok);
      picks.push({ order: parseInt(orderTok), pos: posTok, name: nameTok });
      continue;
    }
    if (!starter) {
      const pitcherTok = tokens.find(t => pitcherNames.has(t));
      if (pitcherTok) starter = pitcherTok;
    }
  }
  return { picks, starter };
}

function applyPasteFill(side) {
  const section = document.getElementById('team-' + side);
  const text = section.querySelector('.paste-box').value;
  const status = section.querySelector('.paste-status');
  const { picks, starter } = parseQuickFill(side, text);
  if (!picks.length && !starter) {
    status.textContent = '일치하는 선수를 찾지 못했습니다. 이름 표기가 로스터와 같은지 확인해 주세요.';
    status.classList.add('error-text');
    return;
  }
  status.classList.remove('error-text');
  const slots = [];
  picks.forEach(p => { slots[p.order - 1] = { pos: p.pos, name: p.name }; });
  if (picks.length) setLineup(side, slots, starter);
  else if (starter) section.querySelector('.starter-select').value = starter;
  const missing = 9 - new Set(picks.map(p => p.order)).size;
  status.textContent = `타순 ${picks.length}명, ` + (starter ? '선발투수 반영' : '선발투수는 못 찾음')
    + (missing > 0 ? ` (${missing}자리는 직접 채워 주세요)` : '');
}

function storageKey(side) { return 'kwb.lineup.' + DATA[side].team; }
function saveLineup(side, team) {
  try { localStorage.setItem(storageKey(side), JSON.stringify(team)); } catch (e) { /* 저장 불가 환경 */ }
}
function loadSaved(side) {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey(side)) || 'null');
    if (!saved) return false;
    setLineup(side, saved.lineup, saved.starter);
    return true;
  } catch (e) { return false; }
}

function collect(side) {
  const section = document.getElementById('team-' + side);
  const lineup = [...section.querySelectorAll('tr[data-order]')].map(row => ({
    pos: row.querySelector('.pos').value, name: row.querySelector('.player').value }));
  const starter = section.querySelector('.starter-select').value;
  const team = DATA[side].team;
  if (!starter) throw new Error(`${team} 선발투수를 골라 주세요.`);
  if (lineup.some(s => !s.name)) throw new Error(`${team} 타순 9명을 모두 골라 주세요.`);
  if (new Set(lineup.map(s => s.name)).size !== 9) throw new Error(`${team} 타순에 같은 선수가 두 번 있습니다.`);
  const missing = FIELD_POSITIONS.filter(p => !lineup.some(s => s.pos === p));
  if (missing.length) throw new Error(`${team} 수비 포지션이 비었습니다: ${missing.join(', ')}`);
  return { starter, lineup };
}

async function run(mode, button) {
  const result = document.getElementById('result');
  let body;
  try {
    body = { mode, homeTeam: DATA.home.team, awayTeam: DATA.away.team, home: collect('home'), away: collect('away') };
  } catch (e) {
    result.innerHTML = `<div class="card alert-error">${escapeHtml(e.message)}</div>`;
    return;
  }
  saveLineup('home', body.home);
  saveLineup('away', body.away);
  document.querySelectorAll('.actions button').forEach(b => b.disabled = true);
  result.innerHTML = `<div class="card">${mode === 'analyze' ? '시나리오 분석' : '확정 예측'} 계산 중...</div>`;
  try {
    const response = await fetch('/simulation/scenario', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.message || '서버 오류');
    lastRun = { mode, body, data };
    result.innerHTML = (mode === 'analyze' ? renderAnalysis(data) : renderPrediction(data)) + recordCard(mode);
    document.getElementById('recordBtn').addEventListener('click', recordPrediction);
  } catch (e) {
    result.innerHTML = `<div class="card alert-error">오류: ${escapeHtml(e.message)}</div>`;
  } finally {
    document.querySelectorAll('.actions button').forEach(b => b.disabled = false);
  }
}

// ---------- 최적 라인업 추천 ----------
async function optimizeLineup(side) {
  const result = document.getElementById('result');
  let body;
  try {
    body = { homeTeam: DATA.home.team, awayTeam: DATA.away.team, home: collect('home'), away: collect('away'), target: side };
  } catch (e) {
    result.innerHTML = `<div class="card alert-error">${escapeHtml(e.message)}</div>`;
    return;
  }
  document.querySelectorAll('.team-actions button, .actions button').forEach(b => b.disabled = true);
  result.innerHTML = '<div class="card">최적 라인업 계산 중...</div>';
  try {
    const response = await fetch('/simulation/optimize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.message || '서버 오류');
    result.innerHTML = renderOptimize(side, data);
    const applyBtn = document.getElementById('applyOptimizeBtn');
    if (applyBtn) applyBtn.addEventListener('click', () => {
      setLineup(side, data.recommended.lineup);
      result.innerHTML = `<div class="card">${escapeHtml(SIDE_LABEL[side])}팀 라인업에 반영했습니다. "시나리오 분석"이나 "확정 예측"으로 다시 확인해 보세요.</div>`;
    });
  } catch (e) {
    result.innerHTML = `<div class="card alert-error">오류: ${escapeHtml(e.message)}</div>`;
  } finally {
    document.querySelectorAll('.team-actions button, .actions button').forEach(b => b.disabled = false);
  }
}

function renderOptimize(side, r) {
  const team = DATA[side].team;
  const posNote = r.positions_available ? '' : `<div class="card alert-warn">포지션 데이터가 없어 지명타자 자리만 추천할 수 있습니다
    (수비 자리는 선수가 실제로 뛰어본 포지션을 확인할 수 없어 추천하지 않습니다).</div>`;
  if (!r.changes.length && !r.order_changes.length) {
    return `<div class="card">
      <h3 class="card-title">최적 라인업 추천 — ${escapeHtml(team)}</h3>
      <p>지금 입력한 라인업이 이미 거의 최적입니다 (벤치 교체나 타순 재배열로 승률을 올릴 자리를 찾지 못했습니다).</p>
    </div>${posNote}`;
  }
  const personnelRows = r.changes.map(c => `
    <tr><td>${c.order}번 ${escapeHtml(c.pos)}</td><td>${escapeHtml(c.from)} → ${escapeHtml(c.to)}</td>
      <td class="num">${c.delta_runs >= 0 ? '+' : ''}${c.delta_runs.toFixed(3)}</td>
      <td class="num up">${pp(c.delta_win)}</td></tr>`).join('');
  const personnelSection = r.changes.length ? `
      <h4>교체</h4>
      <div class="table-wrap"><table class="table effects">
        <tr><th>자리</th><th>교체</th><th class="num">득점 변화</th><th class="num">승률 기여</th></tr>
        ${personnelRows}
      </table></div>` : '';
  const orderRows = r.order_changes.map(c => `
    <tr><td>${escapeHtml(c.name)} (${escapeHtml(c.pos)})</td><td>${c.from_order}번 → ${c.to_order}번</td>
      <td class="num">${c.delta_runs >= 0 ? '+' : ''}${c.delta_runs.toFixed(3)}</td>
      <td class="num up">${pp(c.delta_win)}</td></tr>`).join('');
  const orderSection = r.order_changes.length ? `
      <h4>타순 재배열</h4>
      <div class="table-wrap"><table class="table effects">
        <tr><th>선수</th><th>타순</th><th class="num">득점 변화</th><th class="num">승률 기여</th></tr>
        ${orderRows}
      </table></div>` : '';
  return `
    <div class="card">
      <h3 class="card-title">최적 라인업 추천 — ${escapeHtml(team)} <span class="muted">(${r.games.toLocaleString()}경기 검증)</span></h3>
      <p>현재 라인업 승률 <b>${pct(r.current.win)}</b> → 추천 라인업 승률 <b>${pct(r.recommended.win)}</b>
        <span class="${r.verified_improvement >= 0 ? 'up' : 'down'}">(${pp(r.verified_improvement)})</span></p>
      ${personnelSection}${orderSection}
      <button class="btn btn-primary btn-sm" id="applyOptimizeBtn" type="button" style="margin-top:10px">추천 라인업 적용</button>
      <p class="muted" style="margin-top:8px">수비 자리 교체는 벤치 선수가 실제로 선발 출장한 적 있는 포지션으로만 추천합니다.
        타순은 같은 9명을 상대 투수진 기준 득점 기여가 높은 순으로 재배열한 것입니다.
        계산으로 추정한 효과를 시뮬레이션으로 검증한 결과이며(± 노이즈 있음), 적용 후에는 반드시 "시나리오 분석" 또는
        "확정 예측"으로 다시 확인하세요 — 결과를 그대로 기록하지 않습니다.</p>${posNote}
    </div>
    ${renderWarnings(r.warnings)}`;
}

// ---------- 예측 기록 ----------
let lastRun = null;

function recordCard(mode) {
  const what = mode === 'analyze' ? '라인업 발표 전 예측 (승률 기댓값)' : '라인업 발표 후 확정 예측';
  return `<div class="card">
    <button class="btn btn-primary" id="recordBtn" type="button">이 예측 기록하기</button>
    <span class="muted"> ${what}으로 기록합니다. 기록은 고칠 수 없고, 경기 시작 전 가장 늦은 기록이 채점됩니다.</span>
    <div id="recordStatus"></div></div>`;
}

async function recordPrediction() {
  const status = document.getElementById('recordStatus');
  const gameDate = document.getElementById('gameDate').value;
  if (!lastRun || !gameDate) { status.innerHTML = '<p class="error-text">경기일을 입력해 주세요.</p>'; return; }
  const { mode, body, data } = lastRun;
  const payload = {
    stage: mode, gameDate, homeTeam: body.homeTeam, awayTeam: body.awayTeam,
    homeWinProb: mode === 'analyze' ? data.expected_home : data.home,
    baseHomeProb: mode === 'analyze' ? data.base.home : null,
    rangeLow: mode === 'analyze' ? data.range_home[0] : null,
    rangeHigh: mode === 'analyze' ? data.range_home[1] : null,
    drawProb: mode === 'analyze' ? data.base.draw : data.draw,
    games: mode === 'analyze' ? data.games.base : data.games,
    homeStarter: body.home.starter, awayStarter: body.away.starter,
    homeLineup: body.home.lineup, awayLineup: body.away.lineup,
  };
  document.getElementById('recordBtn').disabled = true;
  try {
    const response = await fetch('/predictions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const saved = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(saved.message || '서버 오류');
    status.innerHTML = `<p>기록했습니다 (${escapeHtml(saved.createdAt.replace('T', ' '))}). <a href="/predictions">예측 성적 보기</a></p>`;
  } catch (e) {
    document.getElementById('recordBtn').disabled = false;
    status.innerHTML = `<p class="error-text">기록 실패: ${escapeHtml(e.message)}</p>`;
  }
}

function probBar(homeProb) {
  const away = DATA.away.team, home = DATA.home.team;
  return `<div class="prob-bar">
    <div class="seg away" data-team="${escapeHtml(away)}" style="width:${(1 - homeProb) * 100}%">${escapeHtml(away)} ${pct(1 - homeProb)}</div>
    <div class="seg home" data-team="${escapeHtml(home)}" style="width:${homeProb * 100}%">${escapeHtml(home)} ${pct(homeProb)}</div></div>`;
}

function renderWarnings(warnings) {
  return warnings && warnings.length
    ? `<div class="card alert-warn">주의<ul>${warnings.map(w => `<li>${escapeHtml(w)}</li>`).join('')}</ul></div>` : '';
}

function renderBullpen(bullpen) {
  const line = side => `${escapeHtml(DATA[side].team)}: 마무리 ${escapeHtml(bullpen[side].closer || '-')}, 중간 ${bullpen[side].middle.map(escapeHtml).join(', ')}`;
  return `<p class="muted">불펜 자동 구성 (세이브·홀드 기록) — ${line('away')} / ${line('home')}</p>`;
}

function renderAnalysis(r) {
  const [low, high] = r.range_home;
  const rows = [...r.slots].sort((a, b) => Math.abs(b.absence_delta_home) - Math.abs(a.absence_delta_home)).slice(0, 12)
    .map(s => {
      const own = s.side === 'home' ? 1 : -1;       // 소속팀 관점으로 표시
      const effect = own * s.absence_delta_home;
      const replacements = s.replacements.map(o =>
        `${escapeHtml(o.name)} ${Math.round(o.share * 100)}% (${pp(own * o.delta_home)})`).join(', ') || '대체 후보 없음';
      return `<tr><td>${escapeHtml(s.team)}</td><td>${s.order}번 ${escapeHtml(s.pos)}</td><td>${escapeHtml(s.name)}</td>
        <td>${Math.round(s.rest_probability * 100)}%</td>
        <td class="${effect >= 0 ? 'up' : 'down'}">${pp(effect)}</td><td class="muted">${replacements}</td></tr>`;
    }).join('');
  return `
    <div class="card">
      <h3 class="card-title">입력한 라인업 기준 승률 <span class="muted">(${r.games.base.toLocaleString()}경기 시뮬레이션, 무승부 ${pct(r.base.draw)})</span></h3>
      ${probBar(r.base.home)}
      <p>예상 득점 ${escapeHtml(DATA.away.team)} ${r.base.away_runs.toFixed(2)} : ${r.base.home_runs.toFixed(2)} ${escapeHtml(DATA.home.team)}</p>
      <h3 class="card-title" style="margin-top:18px">라인업 변동을 반영한 예상</h3>
      <p>${escapeHtml(DATA.home.team)} 승률 기댓값 <b>${pct(r.expected_home)}</b>
         <span class="muted">(가능한 라인업 ${r.games.lineup_draws.toLocaleString()}개 중 80% 범위 ${pct(low)} ~ ${pct(high)})</span></p>
      ${renderBullpen(r.bullpen)}
    </div>
    <div class="card">
      <h3 class="card-title">주요 변수: 선수가 빠지면 소속팀 승률이 얼마나 바뀌나</h3>
      <div class="table-wrap"><table class="table effects">
        <tr><th>팀</th><th>타순</th><th>선수</th><th>결장 확률</th><th>결장 시</th><th>대체 후보 (비율, 효과)</th></tr>
        ${rows}
      </table></div>
      <p class="muted">결장 확률은 시즌 선발 비율로 추정했습니다 (5~35%). 교체 효과는 타석당 득점 가치로 계산해 시뮬레이션에 맞춰 보정했으며, 오차는 약 ±0.5%p입니다.</p>
    </div>
    ${renderWarnings(r.warnings)}`;
}

function renderPrediction(r) {
  const now = new Date().toLocaleString('ko-KR');
  return `
    <div class="card">
      <h3 class="card-title">확정 예측 <span class="muted">(${r.games.toLocaleString()}경기 시뮬레이션, ${escapeHtml(now)})</span></h3>
      ${probBar(r.home)}
      <p class="muted">무승부 ${pct(r.draw)} · 승률은 무승부를 뺀 경기 기준</p>
      ${renderBullpen(r.bullpen)}
    </div>
    ${renderWarnings(r.warnings)}`;
}

renderTeam('away');
renderTeam('home');
for (const side of ['away', 'home']) {
  if (!loadSaved(side)) autoFill(side);
}
document.getElementById('analyzeBtn').addEventListener('click', e => run('analyze', e.target));
document.getElementById('predictBtn').addEventListener('click', e => run('predict', e.target));
</script>
